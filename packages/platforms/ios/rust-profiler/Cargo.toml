[package]
name = "lantern-ios-profiler"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "lantern-ios-profiler"
path = "src/main.rs"

[dependencies]
# Pinned exactly: idevice is pre-1.0 and its service/tunnel APIs move between
# patch releases. Bump deliberately, with a device on hand to re-validate.
idevice = { version = "=0.1.65", default-features = false, features = [
    "ring",              # TLS provider (aws-lc needs cmake; ring builds everywhere)
    "usbmuxd",
    "tcp",
    "core_device_proxy", # iOS 17+ CoreDevice tunnel bootstrap
    "tunnel_tcp_stack",  # userspace TCP over the tunnel (no sudo, no TUN device)
    "rsd",
    "dvt",
    "sysmontap",
    "graphics",
    "device_info",
    "application_listing",
] }
plist = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "io-util",
    "io-std",  # stdin/stdout for the `serve` request loop
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Parity with the Android profiler: a panic must end the process, never leave
# a half-alive poller behind. The stdout write path handles EPIPE explicitly
# (see measure::emit) so a vanished reader is not a panic.
panic = "abort"
strip = true
