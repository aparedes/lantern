[package]
name = "lantern-android-profiler"
version = "0.1.0"
edition = "2021"
publish = false

# The TypeScript side pushes the binary to
# /data/local/tmp/lantern-android-profiler and finds it back by process name.
[[bin]]
name = "lantern-android-profiler"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
